packages:
  - apps/*
  - packages/*
  - tooling/*

allowBuilds:
  '@firebase/util': false
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  core-js: false
  msgpackr-extract: false
  protobufjs: false
  sharp: true
  unrs-resolver: true

overrides:
  '@grpc/grpc-js@<1.13.6': '>=1.13.6'
  dompurify@<=3.4.12: '>=3.4.13'
  dompurify@<=3.4.15: '>=3.4.16'
  dompurify@<=3.4.16: '>=3.4.17'
  dompurify@>=3.4.4 <=3.4.16: '>=3.4.17'
  follow-redirects@>=1.16.0 <1.16.1: '>=1.16.1'
  handlebars@>=3.0.0 <=4.7.9: '>=4.7.10'
  handlebars@>=4.0.0 <=4.7.9: '>=4.7.10'
  next@>=16.0.0 <16.3.8: '>=16.3.8'
  next@>=16.0.0 <=16.4.0: '>=16.4.1'
  next@>=16.2.0 <16.3.6: '>=16.3.6'
  next@>=16.3.0 <16.3.8: '>=16.3.8'
  qs@>=2.2.5 <6.16.0: '>=6.16.0'
  qs@>=6.14.2 <=6.15.3: '>=6.16.0'
  sharp@<0.35.5: '>=0.35.5'
  source-map-js@>=1.0.0 <1.2.2: '>=1.2.2'
  uuid@<11.1.1: '>=11.1.1'
