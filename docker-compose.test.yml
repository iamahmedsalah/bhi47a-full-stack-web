# Isolated fixtures only. Never point these tests at Atlas or production Redis.
services:
  mongodb:
    image: mongo:7.0
    ports:
      - '127.0.0.1:27019:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:63791:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 12
