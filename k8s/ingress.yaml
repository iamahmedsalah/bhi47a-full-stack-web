apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: student-portal-ingress
  namespace: student-portal
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Match the NestJS API body payload size limit of 10MB
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Ensure proper session/cookie forwarding
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    # Security headers injection
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Content-Security-Policy: upgrade-insecure-requests";
spec:
  rules:
    - host: student-portal.local
      http:
        paths:
          # Route all API traffic to the backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: student-portal-api
                port:
                  number: 4000
          # Route Swagger UI / Documentation if exposed (dev clusters)
          - path: /api/docs
            pathType: Prefix
            backend:
              service:
                name: student-portal-api
                port:
                  number: 4000
          # Route all client web traffic to the frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: student-portal-web
                port:
                  number: 3000
  tls:
    - hosts:
        - student-portal.local
      secretName: student-portal-tls-secret
