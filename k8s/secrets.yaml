apiVersion: v1
kind: Secret
metadata:
  name: student-portal-secrets
  namespace: student-portal
type: Opaque
stringData:
  # Replace every value before applying. Do not commit real production secrets.
  MONGODB_URI: "mongodb+srv://user:password@cluster.mongodb.net/student-portal?retryWrites=true&w=majority"
  REDIS_URL: "rediss://:password@redis-host:6379"
  JWT_SECRET: "replace-with-at-least-32-random-bytes"
  CLOUDINARY_API_KEY: "replace-with-cloudinary-api-key"
  CLOUDINARY_API_SECRET: "replace-with-cloudinary-api-secret"
  RESEND_API_KEY: "replace-with-resend-api-key"
  FIREBASE_PROJECT_ID: "replace-with-firebase-project-id"
  FIREBASE_CLIENT_EMAIL: "replace-with-firebase-client-email"
  FIREBASE_PRIVATE_KEY: "replace-with-firebase-private-key"
  ADMIN_EMAIL: "admin@example.edu"
  ADMIN_PASSWORD: "replace-with-one-time-admin-password"
  ADMIN_NAME: "System Administrator"
