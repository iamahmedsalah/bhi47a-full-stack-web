apiVersion: v1
kind: Service
metadata:
  name: student-portal-redis
  namespace: student-portal
  labels:
    app: student-portal-redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: student-portal-redis
  type: ClusterIP

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: student-portal-redis
  namespace: student-portal
spec:
  serviceName: "student-portal-redis"
  replicas: 1
  selector:
    matchLabels:
      app: student-portal-redis
  template:
    metadata:
      labels:
        app: student-portal-redis
    spec:
      containers:
        - name: redis
          image: redis:7.0-alpine
          command:
            - "redis-server"
            - "--appendonly"
            - "yes"
          ports:
            - containerPort: 6379
              name: redis
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
