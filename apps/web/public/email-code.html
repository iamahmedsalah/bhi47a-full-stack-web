<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self';style-src 'unsafe-inline';connect-src 'none';base-uri 'none';form-action 'none'">
  <title>BHI47A — نسخ رمز التحقق / Copy verification code</title>
  <script src="/email-code.js" defer></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f0fdfa;color:#134e4a;font:16px/1.7 Tahoma,Arial,sans-serif}
    main{width:100%;max-width:440px;background:white;border:1px solid #99f6e4;border-radius:20px;padding:32px;text-align:center;box-shadow:0 16px 48px #115e5910}
    .brand{font-size:13px;font-weight:bold;letter-spacing:2px;color:#0f766e}h1{font-size:24px;line-height:1.4;margin:16px 0}p{color:#475569;font-size:14px}
    input{width:100%;font:700 32px/1.5 monospace;letter-spacing:6px;text-align:center;color:#115e59;border:1px solid #99f6e4;background:#f0fdfa;border-radius:12px;padding:12px;direction:ltr}
    button{width:100%;margin-top:20px;background:#0f766e;border:0;border-radius:10px;padding:14px;font:700 16px Tahoma,Arial,sans-serif;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #14b8a6;outline-offset:4px}#status{min-height:48px}
  </style>
</head>
<body>
  <main>
    <div class="brand">BHI47A</div>
    <h1 id="title">نسخ رمز التحقق</h1>
    <p id="description">انسخ الرمز ثم عد إلى الصفحة التي طلبته منها.</p>
    <input id="code" readonly aria-label="رمز التحقق" autocomplete="off" spellcheck="false">
    <button id="copy" type="button" disabled>نسخ الرمز</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="notice">لا تشارك هذا الرمز مع أي شخص. هذه الصفحة لا تتحقق من صلاحية الرمز.</p>
    <noscript>فعّل JavaScript لاستخدام زر النسخ، أو انسخ الرمز من البريد. Enable JavaScript or copy the code from your email.</noscript>
  </main>
</body>
</html>
