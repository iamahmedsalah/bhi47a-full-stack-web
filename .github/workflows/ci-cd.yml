name: CI/CD Production Pipeline

on:
  push:
    branches:
      - main
      - staging
      - 'release/*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read
  packages: write

jobs:
  # ===================================================
  # JOB 1: Linting, Formatting, and Automated Testing
  # ===================================================
  validate:
    name: Lint & Test Application
    runs-on: ubuntu-latest

    services:
      # Spin up database and queue container services for API tests
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4
          run_install: false

      - name: Get pnpm Store Directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Code Style & Linter Audit
        run: pnpm run lint

      - name: Compile Workspace Libraries (Shared Build)
        run: pnpm --filter @student-portal/shared run build

      - name: Run Backend Unit Tests
        run: pnpm --filter @student-portal/api run test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/student-portal-test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: testing-secret-must-be-rotated-32-chars

      - name: Run Backend End-to-End (E2E) Tests
        run: pnpm --filter @student-portal/api run test:e2e
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/student-portal-e2e
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: testing-secret-must-be-rotated-32-chars

      - name: Dry-Run Production Build
        run: pnpm run build

  # ===================================================
  # JOB 2: Build and Publish Production Docker Images
  # ===================================================
  build-and-publish:
    name: Build & Push Docker Images
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Extract metadata (tags, labels) for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build and Push Backend API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ id.meta-api.outputs.tags }}
          labels: ${{ id.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Web Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ id.meta-web.outputs.tags }}
          labels: ${{ id.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===================================================
  # JOB 3: CD Deployment to Cluster (e.g. AWS EKS / GCP GKE)
  # ===================================================
  deploy:
    name: Deploy to Kubernetes Cluster
    needs: build-and-publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Kubernetes CLI (kubectl)
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Authenticate with Kubernetes Cluster
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      # Using Kubernetes Kustomize or direct deployment values replacement
      - name: Inject Configuration & Deploy to Kubernetes
        run: |
          cd k8s
          # Replace placeholder images with built SHA tag
          sed -i "s|ghcr.io/student-portal/api:latest|ghcr.io/${{ github.repository }}/api:sha-${{ github.sha }}|g" api-deployment.yaml
          sed -i "s|ghcr.io/student-portal/web:latest|ghcr.io/${{ github.repository }}/web:sha-${{ github.sha }}|g" web-deployment.yaml
          
          # Deploy manifests
          kubectl apply -f configmap.yaml
          kubectl apply -f secrets.yaml
          kubectl apply -f redis-deployment.yaml
          kubectl apply -f api-deployment.yaml
          kubectl apply -f web-deployment.yaml
          kubectl apply -f ingress.yaml
          
          # Force deployment rollouts (Zero-Downtime Rolling Update check)
          kubectl rollout status deployment/student-portal-api -n student-portal
          kubectl rollout status deployment/student-portal-web -n student-portal
