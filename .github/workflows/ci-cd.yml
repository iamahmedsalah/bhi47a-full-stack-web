name: CI/CD - Vercel and VPS

on:
  push:
    branches:
      - main
      - staging
      - "release/*"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Manual deployment target (main pushes also deploy to VPS and Vercel)
        type: choice
        default: validate
        options:
          - validate
          - vps
          - vercel

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate monorepo
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify VPS deployment trigger policy
        run: node --test scripts/vps-workflow.test.cjs

      - name: Verify performance query-plan summaries
        run: node --test scripts/performance-query-plans.test.mjs

      - name: Verify authentication admission boundaries
        run: node --test scripts/auth-admission.test.mjs

      - name: Verify Google sign-in nonce refresh and cooldown
        run: node --test apps/web/tests/google-signin-rate-limit.test.mjs

      - name: Verify quiz release deadlines and states
        run: pnpm --filter @student-portal/web test:quiz-release

      - name: Verify isolated E2E database policy
        run: node --test scripts/e2e-runner-safety.test.cjs

      - name: Verify admission replica-set runner isolation
        run: node --test apps/api/test/admissions/runner-safety.test.cjs

      - name: Lint workspace
        run: pnpm run lint

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Test API
        run: pnpm run test -- --runInBand
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/student-portal-test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: testing-secret-must-be-rotated-32-chars
          QUEUE_WORKERS_ENABLED: "false"
          RUN_STARTUP_TASKS: "false"

      - name: Test attendance location acquisition
        run: pnpm --filter @student-portal/web test:location

      - name: Test course timetable layout and filtering
        run: pnpm --filter @student-portal/web test:timetable

      - name: Build workspace
        run: pnpm run build

      - name: Validate API Vercel runtime compatibility
        shell: bash
        run: |
          configured_node_options="$(node -p "require('./apps/api/vercel.json').env.NODE_OPTIONS")"
          test "$configured_node_options" = "--experimental-require-module"
          NODE_OPTIONS="$configured_node_options" node -e "require('@nestjs/core')"

      - name: Validate web route manifest
        run: >-
          node -e "const routes=require('./apps/web/.next/routes-manifest.json');
          const appRoutes=require('./apps/web/.next/app-path-routes-manifest.json');
          if (!routes.staticRoutes.some(({page}) => page === '/') || appRoutes['/page'] !== '/')
          throw new Error('The web build does not contain the root route');"

      - name: Install Chromium for passkey acceptance
        run: pnpm --filter @student-portal/api exec playwright install --with-deps chromium

      - name: Typecheck API end-to-end fixtures
        run: pnpm --filter @student-portal/api typecheck:e2e

      - name: Test timetable views and PNG downloads in Chromium
        run: pnpm --filter @student-portal/web test:timetable:browser

      - name: Test automatic quiz release in Chromium
        run: pnpm --filter @student-portal/web test:quiz-release:browser

      - name: Test admission-period management in Chromium
        run: pnpm --filter @student-portal/web test:admissions:browser

      - name: Start isolated admission replica set
        run: docker compose -p student-portal-admissions-e2e -f docker-compose.admissions-test.yml up -d --wait

      - name: Test student-code transactions and concurrent allocation
        run: pnpm --filter @student-portal/api test:admissions:e2e

      - name: Stop isolated admission services
        if: always()
        run: docker compose -p student-portal-admissions-e2e -f docker-compose.admissions-test.yml down

      - name: Test responsive security and settings in Chromium
        run: pnpm --filter @student-portal/web test:security

      - name: Test API end to end with browser passkeys
        run: pnpm run test:e2e -- --runInBand
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/student-portal-e2e
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: testing-secret-must-be-rotated-32-chars
          QUEUE_WORKERS_ENABLED: "false"
          RUN_STARTUP_TASKS: "false"

  deploy-api:
    name: Deploy API to Vercel
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deployment_target == 'vercel')
    runs-on: ubuntu-latest
    environment:
      name: production-api
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@59.23.2

      - name: Reset API Vercel project link
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is not configured}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is not configured}"
          : "${VERCEL_PROJECT_ID:?VERCEL_API_PROJECT_ID is not configured}"
          rm -rf -- .vercel
          mkdir -p -- .vercel
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync(
            '.vercel/project.json',
            `${JSON.stringify({
              orgId: process.env.VERCEL_ORG_ID,
              projectId: process.env.VERCEL_PROJECT_ID,
            }, null, 2)}\n`,
          );
          NODE

      - name: Pull API production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build API deployment artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy API production artifacts
        id: deploy
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod \
            --env NODE_OPTIONS=--experimental-require-module \
            --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify API health
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            "${{ steps.deploy.outputs.url }}/api/health"

  deploy-web:
    name: Deploy web to Vercel
    needs:
      - validate
      - deploy-api
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deployment_target == 'vercel')
    runs-on: ubuntu-latest
    environment:
      name: production-web
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
      VERCEL_API_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@59.23.2

      - name: Validate web deployment target
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_API_PROJECT_ID"
          test "$VERCEL_PROJECT_ID" != "$VERCEL_API_PROJECT_ID"

      - name: Reset web Vercel project link
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is not configured}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is not configured}"
          : "${VERCEL_PROJECT_ID:?VERCEL_WEB_PROJECT_ID is not configured}"

          rm -rf -- .vercel
          mkdir -p -- .vercel
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync(
            '.vercel/project.json',
            `${JSON.stringify({
              orgId: process.env.VERCEL_ORG_ID,
              projectId: process.env.VERCEL_PROJECT_ID,
            }, null, 2)}\n`,
          );
          NODE

      - name: Pull web production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build web deployment artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Validate Vercel web artifacts
        run: >-
          node -e "const fs=require('node:fs');
          const path='.vercel/output/config.json';
          if (!fs.existsSync(path)) throw new Error('Vercel did not create output/config.json');
          const config=JSON.parse(fs.readFileSync(path,'utf8'));
          if (config.version !== 3 || !Array.isArray(config.routes) || config.routes.length === 0)
          throw new Error('Vercel produced an empty or invalid web routing artifact');"

      - name: Deploy web production artifacts
        id: deploy
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify web deployment
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
            "${{ steps.deploy.outputs.url }}" > /dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
            "${{ steps.deploy.outputs.url }}/ar/login" > /dev/null

  docker-validate:
    name: Build and smoke-test VPS containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ci
      REDIS_PASSWORD: ci-redis-password
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment scripts
        run: |
          bash -n deploy/deploy.sh deploy/backup.sh
          shellcheck deploy/deploy.sh deploy/backup.sh
          bash deploy/tests/operations.test.sh
      - name: Build API image
        run: docker build -f Dockerfile.api -t student-portal-api:ci .
      - name: Build standalone web image
        run: docker build -f Dockerfile.web -t student-portal-web:ci .
      - name: Create isolated CI environment
        shell: bash
        run: |
          umask 077
          cat > .env.prod <<'ENV'
          NODE_ENV=production
          PORT=4000
          API_PORT=4000
          MONGODB_URI=mongodb://mongodb:27017/student-portal-ci
          JWT_SECRET=ci-only-secret-at-least-thirty-two-bytes
          CLIENT_URL=https://portal.example.com
          WEB_BASE_URL=https://portal.example.com
          COOKIE_SAME_SITE=none
          RESEND_API_KEY=re_ci_dummy_key
          REDIS_PASSWORD=ci-redis-password
          REDIS_URL=redis://:ci-redis-password@redis:6379
          QUEUE_REQUIRED=true
          QUEUE_WORKERS_ENABLED=true
          RUN_STARTUP_TASKS=false
          ENV
      - name: Prepare existing data in isolated CI MongoDB
        shell: bash
        run: |
          docker compose --env-file .env.prod -f docker-compose.prod.yml -f deploy/compose.ci.yml up -d --wait mongodb
          docker compose --env-file .env.prod -f docker-compose.prod.yml -f deploy/compose.ci.yml exec -T mongodb mongosh --quiet student-portal-ci --eval '
            db.users.insertOne({_id:"existing-admin",role:"admin",email:"existing@example.com",passwordHash:"unchanged-hash",tokenVersion:7});
            db.grades.insertOne({_id:"existing-grade",studentCode:"existing-student",total:83});'
      - name: Start production topology with isolated MongoDB
        run: docker compose --env-file .env.prod -f docker-compose.prod.yml -f deploy/compose.ci.yml up -d --no-build --wait --wait-timeout 240
      - name: Verify HTTP and preserve existing data across restart
        shell: bash
        run: |
          curl --fail --silent http://127.0.0.1:4000/api/health > /dev/null
          curl --fail --silent http://127.0.0.1:3000/ar/login > /dev/null
          docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T api sh -c 'test ! -f dist/database/seed.js && test ! -f dist/database/reset-student-data.js'
          docker compose --env-file .env.prod -f docker-compose.prod.yml -f deploy/compose.ci.yml restart api
          docker compose --env-file .env.prod -f docker-compose.prod.yml -f deploy/compose.ci.yml up -d --no-build --wait --wait-timeout 240
          docker compose --env-file .env.prod -f docker-compose.prod.yml -f deploy/compose.ci.yml exec -T mongodb mongosh --quiet student-portal-ci --eval '
            if (db.users.countDocuments({}) !== 1 ||
                db.users.countDocuments({_id:"existing-admin",role:"admin",email:"existing@example.com",passwordHash:"unchanged-hash",tokenVersion:7}) !== 1 ||
                db.grades.countDocuments({}) !== 1 ||
                db.grades.countDocuments({_id:"existing-grade",studentCode:"existing-student",total:83}) !== 1)
              throw new Error("Deployment changed existing data");'
      - name: Container logs on failure
        if: failure()
        shell: bash
        run: |
          if [ -f .env.prod ]; then
            docker compose --env-file .env.prod -f docker-compose.prod.yml -f deploy/compose.ci.yml logs --tail 100
          fi
      - name: Clean up isolated containers
        if: always()
        shell: bash
        run: |
          if [ -f .env.prod ]; then
            docker compose --env-file .env.prod -f docker-compose.prod.yml -f deploy/compose.ci.yml down -v
          fi

  deploy-vps:
    name: Deploy reviewed commit to VPS
    needs: [validate, docker-validate]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deployment_target == 'vps')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-vps
    concurrency:
      group: production-vps
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH with pinned server host key
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Configure VPS_HOST in production-vps environment secrets}"
          : "${VPS_USER:?Configure VPS_USER in production-vps environment secrets}"
          : "${VPS_SSH_KEY:?Configure VPS_SSH_KEY in production-vps environment secrets}"
          : "${VPS_KNOWN_HOSTS:?Configure VPS_KNOWN_HOSTS in production-vps environment secrets}"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/vps_key' EXIT
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/vps_key \
            "$VPS_USER@$VPS_HOST" bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          release="$1"
          [[ "$release" =~ ^[0-9a-f]{40}$ ]]
          cd "$HOME/app"
          mkdir -p .deploy
          # Lock the checkout as well as the container deployment.
          exec 8>.deploy/checkout.lock
          flock -n 8
          git diff --quiet
          git diff --cached --quiet
          git fetch origin main
          git merge-base --is-ancestor "$release" origin/main
          git checkout --detach "$release"
          DEPLOY_CHECKOUT_LOCKED=1 bash deploy/deploy.sh
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            http://127.0.0.1:4000/api/health > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            http://127.0.0.1:3000/ar/login/student > /dev/null
          REMOTE
