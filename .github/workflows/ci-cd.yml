name: CI/CD - VPS

on:
  push:
    branches:
      - main
      - staging
      - "release/*"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Manual deployment target (main pushes deploy to VPS)
        type: choice
        default: validate
        options:
          - validate
          - vps

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate monorepo
    runs-on: ubuntu-24.04

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Jest report directory
        run: >-
          node -e "require('node:fs').mkdirSync('apps/api/coverage', { recursive: true })"

      - name: Verify VPS deployment trigger policy
        run: node --test scripts/vps-workflow.test.cjs scripts/ci-test-report.test.cjs scripts/auth-readiness.test.cjs

      - name: Verify patched development dependency contracts
        run: node --test scripts/dependency-security.test.cjs

      - name: Verify materials migration and restore boundaries
        run: node --test deploy/materials/manage.test.cjs

      - name: Verify performance query-plan summaries
        run: node --test scripts/performance-query-plans.test.mjs

      - name: Verify authentication admission boundaries
        run: node --test scripts/auth-admission.test.mjs

      - name: Verify Google sign-in nonce refresh and cooldown
        run: node --test apps/web/tests/google-signin-rate-limit.test.mjs

      - name: Verify login history and network presentation
        run: node --test apps/web/tests/session-presentation.test.mjs

      - name: Verify canonical-domain redirects
        run: node --test apps/web/tests/canonical-redirect.test.mjs

      - name: Verify bilingual student form validation
        run: node --test apps/web/tests/student-form-validation.test.mjs

      - name: Verify quiz release deadlines and states
        run: pnpm --filter @student-portal/web test:quiz-release

      - name: Verify background material uploads and cancellation
        run: pnpm --filter @student-portal/web test:materials

      - name: Verify isolated E2E database policy
        run: node --test scripts/e2e-runner-safety.test.cjs

      - name: Verify admission replica-set runner isolation
        run: node --test apps/api/test/admissions/runner-safety.test.cjs

      - name: Verify Control fixture and data-audit safety
        run: node --test apps/api/test/control/runner-safety.test.cjs apps/api/test/control-data-audit.test.cjs scripts/seed-control-demo.test.cjs

      - name: Verify Control acceptance audit and restore isolation
        run: pnpm run test:control:acceptance-safety

      - name: Verify localized Control validation messages
        run: pnpm run test:control:validation

      - name: Lint workspace
        id: lint
        run: pnpm run lint

      - name: Typecheck workspace
        id: typecheck
        run: pnpm run typecheck

      - name: Test API
        id: api-unit
        # coverage/** is a declared Turbo output, so cache hits restore the JSON too.
        run: pnpm run test -- --runInBand --json --outputFile="$GITHUB_WORKSPACE/apps/api/coverage/ci-api-unit.json"
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/student-portal-test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: testing-secret-must-be-rotated-32-chars
          QUEUE_WORKERS_ENABLED: "false"
          RUN_STARTUP_TASKS: "false"

      - name: Test attendance location acquisition
        run: pnpm --filter @student-portal/web test:location

      - name: Test course timetable layout and filtering
        run: pnpm --filter @student-portal/web test:timetable

      - name: Build workspace
        id: build
        run: pnpm run build

      - name: Verify materials migration and restore against isolated MongoDB
        run: node --test deploy/materials/integration.test.cjs
        env:
          MATERIALS_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/materials-storage-test

      - name: Validate web route manifest
        run: >-
          node -e "const routes=require('./apps/web/.next/routes-manifest.json');
          const appRoutes=require('./apps/web/.next/app-path-routes-manifest.json');
          if (!routes.staticRoutes.some(({page}) => page === '/') || appRoutes['/page'] !== '/')
          throw new Error('The web build does not contain the root route');"

      - name: Verify production canonical-domain routing
        run: node apps/web/tests/canonical-redirect.production.mjs

      - name: Install Chromium for passkey acceptance
        run: pnpm --filter @student-portal/api exec playwright install --with-deps chromium

      - name: Typecheck API end-to-end fixtures
        run: pnpm --filter @student-portal/api typecheck:e2e

      - name: Verify session bootstrap and login navigation
        run: node apps/web/tests/auth-bootstrap.browser.mjs

      - name: Test timetable views and PNG downloads in Chromium
        run: pnpm --filter @student-portal/web test:timetable:browser

      - name: Test automatic quiz release in Chromium
        run: pnpm --filter @student-portal/web test:quiz-release:browser

      - name: Test background uploads and notification progress in Chromium
        run: pnpm --filter @student-portal/web test:materials:browser

      - name: Test admission-period management in Chromium
        run: pnpm --filter @student-portal/web test:admissions:browser

      - name: Test analytics workbook selection and downloads in Chromium
        run: pnpm --filter @student-portal/web test:analytics:browser

      - name: Start isolated admission replica set
        run: docker compose -p student-portal-admissions-e2e -f docker-compose.admissions-test.yml up -d --wait

      - name: Test student-code transactions and concurrent allocation
        id: admissions
        run: pnpm --filter @student-portal/api test:admissions:e2e --json --outputFile="$GITHUB_WORKSPACE/apps/api/coverage/ci-admissions.json"

      - name: Test Control releases, corrections and academic reconciliation
        id: control
        run: pnpm run test:control:e2e --json --outputFile="$GITHUB_WORKSPACE/apps/api/coverage/ci-control.json"
        env:
          CONTROL_TEST_MONGODB_URI: mongodb://127.0.0.1:27021/control-e2e

      - name: Test Control workbook and result releases in Chromium
        id: control-browser
        run: |
          pnpm run test:control:browser
          pnpm run test:control:import:browser
          pnpm run test:control:release:browser
          pnpm run test:control:attempts:browser

      - name: Stop isolated admission services
        if: always()
        run: docker compose -p student-portal-admissions-e2e -f docker-compose.admissions-test.yml down

      - name: Test responsive security and settings in Chromium
        run: pnpm --filter @student-portal/web test:security

      - name: Test API end to end with browser passkeys
        id: api-e2e
        run: pnpm run test:e2e -- --runInBand --json --outputFile="$GITHUB_WORKSPACE/apps/api/coverage/ci-api-e2e.json"
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/student-portal-e2e
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: testing-secret-must-be-rotated-32-chars
          QUEUE_WORKERS_ENABLED: "false"
          RUN_STARTUP_TASKS: "false"

      - name: Publish test summary and failure annotations
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
          CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-test-report.cjs

      - name: Upload structured test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-test-reports
          path: apps/api/coverage/ci-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload admissions browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: admissions-browser-failures
          path: |
            outputs/admissions/failure.png
            outputs/admissions/failure-dom.html
            outputs/admissions/runtime-error.txt
            outputs/admissions-workflow/failure.png
            outputs/admissions-workflow/failure-dom.html
            outputs/admissions-workflow/runtime-errors.json
          if-no-files-found: ignore
          retention-days: 7

  docker-validate:
    name: Build and smoke-test VPS containers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ci
      REDIS_PASSWORD: ci-redis-password
    steps:
      - uses: actions/checkout@v5
      - name: Check deployment scripts
        run: |
          bash -n deploy/deploy.sh deploy/backup.sh deploy/materials/backup.sh
          shellcheck deploy/deploy.sh deploy/backup.sh deploy/materials/backup.sh
          bash deploy/tests/operations.test.sh
          bash deploy/tests/materials-backup.test.sh
          python3 -B deploy/tests/materials-nginx-provision.test.py
          python3 -B deploy/tests/materials-backup-state.test.py
          python3 -B deploy/tests/materials-extract-restore.test.py
      - name: Validate private materials Nginx configuration
        run: >-
          docker run --rm
          --mount "type=bind,source=$PWD/deploy/nginx/portal.conf,target=/etc/nginx/conf.d/default.conf,readonly"
          --mount "type=bind,source=$PWD/deploy/nginx/portal-materials-proxy.conf,target=/etc/nginx/snippets/portal-materials-proxy.conf,readonly"
          --mount "type=bind,source=$PWD/deploy/nginx/portal-materials-locations.conf,target=/etc/nginx/snippets/portal-materials-locations.conf,readonly"
          nginx:alpine nginx -t
      - name: Build API image
        run: docker build -f Dockerfile.api -t student-portal-api:ci .
      - name: Build standalone web image
        run: docker build -f Dockerfile.web -t student-portal-web:ci .
      - name: Create isolated CI environment
        shell: bash
        run: |
          umask 077
          cat > .env.prod <<'ENV'
          NODE_ENV=production
          PORT=4000
          API_PORT=4000
          MONGODB_URI=mongodb://mongodb:27017/student-portal-ci
          JWT_SECRET=ci-only-secret-at-least-thirty-two-bytes
          CLIENT_URL=https://portal.example.com
          WEB_BASE_URL=https://portal.example.com
          COOKIE_SAME_SITE=none
          RESEND_API_KEY=re_ci_dummy_key
          REDIS_PASSWORD=ci-redis-password
          REDIS_URL=redis://:ci-redis-password@redis:6379
          QUEUE_REQUIRED=true
          QUEUE_WORKERS_ENABLED=true
          RUN_STARTUP_TASKS=false
          ENV
      - name: Prepare existing data in isolated CI MongoDB
        shell: bash
        run: |
          docker compose --env-file .env.prod -f docker-compose.prod.yml -f deploy/compose.ci.yml up -d --wait mongodb
          docker compose --env-file .env.prod -f docker-compose.prod.yml -f deploy/compose.ci.yml exec -T mongodb mongosh --quiet student-portal-ci --eval '
            db.users.insertOne({_id:"existing-admin",role:"admin",email:"existing@example.com",passwordHash:"unchanged-hash",tokenVersion:7});
            db.grades.insertOne({_id:"existing-grade",studentCode:"existing-student",total:83});'
      - name: Start production topology with isolated MongoDB
        run: docker compose --env-file .env.prod -f docker-compose.prod.yml -f deploy/compose.ci.yml up -d --no-build --wait --wait-timeout 240
      - name: Verify HTTP and preserve existing data across restart
        shell: bash
        run: |
          curl --fail --silent http://127.0.0.1:4000/api/health > /dev/null
          curl --fail --silent http://127.0.0.1:3000/ar/login > /dev/null
          docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T api node operations/materials/ci-storage-smoke.cjs write
          docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T api sh -c 'test ! -f dist/database/seed.js && test ! -f dist/database/reset-student-data.js'
          docker compose --env-file .env.prod -f docker-compose.prod.yml -f deploy/compose.ci.yml up -d --no-build --no-deps --force-recreate api
          docker compose --env-file .env.prod -f docker-compose.prod.yml -f deploy/compose.ci.yml up -d --no-build --wait --wait-timeout 240
          docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T api node operations/materials/ci-storage-smoke.cjs read
          docker compose --env-file .env.prod -f docker-compose.prod.yml -f deploy/compose.ci.yml exec -T mongodb mongosh --quiet student-portal-ci --eval '
            if (db.users.countDocuments({}) !== 1 ||
                db.users.countDocuments({_id:"existing-admin",role:"admin",email:"existing@example.com",passwordHash:"unchanged-hash",tokenVersion:7}) !== 1 ||
                db.grades.countDocuments({}) !== 1 ||
                db.grades.countDocuments({_id:"existing-grade",studentCode:"existing-student",total:83}) !== 1)
              throw new Error("Deployment changed existing data");'
      - name: Container logs on failure
        if: failure()
        shell: bash
        run: |
          if [ -f .env.prod ]; then
            docker compose --env-file .env.prod -f docker-compose.prod.yml -f deploy/compose.ci.yml logs --tail 100
          fi
      - name: Clean up isolated containers
        if: always()
        shell: bash
        run: |
          if [ -f .env.prod ]; then
            docker compose --env-file .env.prod -f docker-compose.prod.yml -f deploy/compose.ci.yml down -v
          fi

  deploy-vps:
    name: Deploy reviewed commit to VPS
    needs: [validate, docker-validate]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deployment_target == 'vps')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production-vps
      url: https://bhi47.app
    concurrency:
      group: production-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Deploy over SSH with pinned server host key
        id: deploy
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Configure VPS_HOST in production-vps environment secrets}"
          : "${VPS_USER:?Configure VPS_USER in production-vps environment secrets}"
          : "${VPS_SSH_KEY:?Configure VPS_SSH_KEY in production-vps environment secrets}"
          : "${VPS_KNOWN_HOSTS:?Configure VPS_KNOWN_HOSTS in production-vps environment secrets}"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/vps_key' EXIT
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/vps_key \
            "$VPS_USER@$VPS_HOST" bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          release="$1"
          [[ "$release" =~ ^[0-9a-f]{40}$ ]]
          cd "$HOME/app"
          mkdir -p .deploy
          # Lock the checkout as well as the container deployment.
          exec 8>.deploy/checkout.lock
          flock -n 8
          git diff --quiet
          git diff --cached --quiet
          # This checkout is managed exclusively by CI. Remove stale
          # non-ignored artifacts while preserving ignored secrets and state.
          git clean -fd
          git fetch origin main
          git merge-base --is-ancestor "$release" origin/main
          git checkout --detach "$release"
          DEPLOY_CHECKOUT_LOCKED=1 bash deploy/deploy.sh
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            http://127.0.0.1:4000/api/health > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            http://127.0.0.1:3000/ar/login/student > /dev/null
          REMOTE

      - name: Verify public portal after VPS deployment
        id: public-health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 \
            https://bhi47.app/api/health | python3 -c 'import json,sys; body=json.load(sys.stdin); healthy=isinstance(body,dict) and body.get("success") is True and isinstance(body.get("data"),dict) and body["data"].get("status") == "ok"; sys.exit(0 if healthy else "Public API health check failed: expected success=true and data.status=ok")'
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 \
            --output /dev/null https://bhi47.app/ar/login/student
            node scripts/auth-readiness.cjs https://bhi47.app

      - name: Publish VPS deployment report
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          PUBLIC_HEALTH_OUTCOME: ${{ steps.public-health.outcome }}
        run: |
          {
            printf '## VPS deployment report\n\n'
            printf '[Open Student Portal](https://bhi47.app) · [Login](https://bhi47.app/ar/login/student)\n\n'
            printf '| Check | Result |\n| --- | --- |\n'
            printf '| SSH deployment and internal health | %s |\n' "$DEPLOY_OUTCOME"
            printf '| Public HTTPS health and login | %s |\n\n' "$PUBLIC_HEALTH_OUTCOME"
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'A failed public check requires investigation; it does not automatically roll back the VPS.\n'
          } >> "$GITHUB_STEP_SUMMARY"
