# /etc/nginx/sites-available/portal.conf
# Replace <DOMAIN> with your server hostname (e.g., 161-97-100-20.sslip.io), then run:
#   sudo certbot --nginx -d <DOMAIN>   (adds TLS 443 block and HTTP->HTTPS redirect)

upstream portal_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream portal_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN>;

    server_tokens off;
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss image/svg+xml font/ttf font/otf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend API endpoints
    location /api/ {
        proxy_pass http://portal_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr (NOT $proxy_add_x_forwarded_for) prevents client IP spoofing in rate limiters
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Next.js immutable static build assets
    location /_next/static/ {
        proxy_pass http://portal_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js Frontend
    location / {
        proxy_pass http://portal_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
