# Include inside an existing HTTPS server block; preserve its Certbot/TLS settings.
location /_private-materials/ {
    internal;
    alias /srv/student-portal/materials/;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~ "^/api/admin/courses/[a-fA-F0-9]{24}/syllabus$" {
    client_max_body_size 101m;
    include /etc/nginx/snippets/portal-materials-proxy.conf;
}

location ~ "^/api/(admin/)?courses/[a-fA-F0-9]{24}/materials$" {
    client_max_body_size 26m;
    include /etc/nginx/snippets/portal-materials-proxy.conf;
}
