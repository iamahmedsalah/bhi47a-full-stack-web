# Production stack for Contabo VPS (Single Host).
# Database: MongoDB Atlas (external over TLS). No Mongo container on host.
# Local services: Redis (cache & BullMQ), NestJS API, Next.js Web standalone.
# Host Nginx terminates TLS and proxies to loopback 127.0.0.1:3000 / 127.0.0.1:4000.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.prod}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.prod}
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(redis-cli ping)\" = PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: student-portal-api:${RELEASE_TAG:-prod}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env.prod
    environment:
      MATERIALS_ROOT: /data/materials
      MATERIALS_DELIVERY: ${MATERIALS_DELIVERY:-nginx}
    volumes:
      - ${MATERIALS_HOST_ROOT:-/srv/student-portal/materials}:/data/materials
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2048m
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_APP_ENV: production
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-1.0.0}
    image: student-portal-web:${RELEASE_TAG:-prod}
    environment:
      CANONICAL_WEB_ORIGIN: ${CANONICAL_WEB_ORIGIN:-https://bhi47.app}
      LEGACY_WEB_HOSTS: ${LEGACY_WEB_HOSTS:-portal.169-58-108-189.sslip.io}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ar || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536m
    logging: *default-logging

networks:
  internal:
    driver: bridge

volumes:
  redis_data:
