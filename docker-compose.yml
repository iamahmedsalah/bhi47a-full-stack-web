services:
  # ===================================================
  # LOCAL DATABASE: MongoDB (Optional - offline use only)
  # Run with: docker compose --profile local-db up
  # ===================================================
  mongodb:
    profiles: ["local-db"]
    image: mongo:6.0
    container_name: student-portal-mongodb-prod
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: student-portal
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===================================================
  # LOCAL CACHE & QUEUE: Redis (Optional - offline use only)
  # Run with: docker compose --profile local-db up
  # ===================================================
  redis:
    profiles: ["local-db"]
    image: redis:7.0-alpine
    container_name: student-portal-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ===================================================
  # BACKEND SERVICE: NestJS API (Production Build)
  # Uses the exact same environment variables and DB as dev
  # ===================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: student-portal-api-prod
    restart: always
    ports:
      - "4000:4000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - API_PORT=4000
      - PORT=4000
      # Uses the exact same MONGODB_URI as development (e.g. MongoDB Atlas)
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=${REDIS_URL:-}
      - QUEUE_REQUIRED=${QUEUE_REQUIRED:-false}
      - RATE_LIMIT_STORE=${RATE_LIMIT_STORE:-mongo}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - DNS_SERVERS=${DNS_SERVERS:-8.8.8.8,1.1.1.1}
      - ENABLE_SWAGGER=${ENABLE_SWAGGER:-false}
      - AUTO_SEED=false

  # ===================================================
  # FRONTEND SERVICE: Next.js Web (Production Build)
  # Uses the exact same environment variables as dev
  # ===================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_APP_ENV: production
        NEXT_PUBLIC_APP_VERSION: 1.0.0
    container_name: student-portal-web-prod
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      - NEXT_PUBLIC_APP_ENV=production
    depends_on:
      - api

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
